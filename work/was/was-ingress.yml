apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-petclinic
  namespace: was
spec:
  ingressClassName: nginx
  rules:
    - host: www.kdh.test
      http:
        paths:
          - path: /clinic
            pathType: Prefix
            backend:
              service:
                name: spring-petclinic
                port:
                  number: 80
